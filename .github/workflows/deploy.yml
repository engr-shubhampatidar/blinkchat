name: CI/CD Deployment

on:
  push:
    branches:
      - main # Deploy only when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install dependencies
      - name: Install dependencies
        run: |
          cd frontend && npm install
          cd ../backend && npm install

      # Build the frontend
      - name: Build Frontend
        run: |
          cd frontend
          CI=false npm run build

      # Configure SSH Key
      - name: Configure SSH Key
        env:
          KEY: ${{ secrets.EC2_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Add EC2 host to known_hosts
      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Deploy to EC2
      - name: Deploy Frontend and Restart Backend
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          # Define paths
          BUILD_DIR=/home/${{ env.USER }}/blinkchat/backend/build
          BACKEND_DIR=/home/${{ env.USER }}/blinkchat/backend

          # Upload frontend build to backend build directory
          scp -r frontend/build/* ${{ env.USER }}@${{ env.HOST }}:$BUILD_DIR

          # Restart backend application
          ssh ${{ env.USER }}@${{ env.HOST }} "
          cd $BACKEND_DIR && \
          npm install && \
          pm2 reload index.js --update-env
          "
